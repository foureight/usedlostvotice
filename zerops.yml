# Usedlost Vodice — Next.js SSR na Zerops
# Docs: https://docs.zerops.io/zerops-yaml/specification
zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      # Keep admin uploads across deploys (JSON content + public media).
      volume:
        hostname: cmsdata
        mountPath: /srv/cms
        readOnly: false
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        NEXT_PUBLIC_SITE_URL: https://usedlostvodice.cz
        # Same simple password login as Dal Birbante (/admin → heslo).
        ADMIN_PASSWORD: VodiceAdmin2026!
        CMS_DATA_DIR: /srv/cms
      start: sh scripts/zerops-start.sh
      healthCheck:
        httpGet:
          port: 3000
          path: /
