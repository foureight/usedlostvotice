# Usedlost Vodice — Next.js SSR na Zerops
# Docs: https://docs.zerops.io/zerops-yaml/specification
zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      # Volume dál drží nahrané fotky mezi deployi (dokud běží i local helpers).
      volume:
        hostname: cmsdata
        mountPath: /srv/cms
        readOnly: false
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        NEXT_PUBLIC_SITE_URL: https://usedlostvodice.cz
        ADMIN_USER: michal@tribo.cz
        ADMIN_PASSWORD: VodiceAdmin2026!
        KEYSTATIC_ADMIN_PASSWORD: VodiceAdmin2026!
        CMS_DATA_DIR: /srv/cms
        # Keystatic GitHub mode — hodnoty nastav v Zerops GUI (secrets)
        # po vytvoření GitHub App přes /keystatic (Create GitHub App).
        KEYSTATIC_GITHUB_CLIENT_ID: ${KEYSTATIC_GITHUB_CLIENT_ID}
        KEYSTATIC_GITHUB_CLIENT_SECRET: ${KEYSTATIC_GITHUB_CLIENT_SECRET}
        KEYSTATIC_SECRET: ${KEYSTATIC_SECRET}
        NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG: ${NEXT_PUBLIC_KEYSTATIC_GITHUB_APP_SLUG}
      start: sh scripts/zerops-start.sh
      healthCheck:
        httpGet:
          port: 3000
          path: /
