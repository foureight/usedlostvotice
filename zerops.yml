# Usedlost Vodice — Next.js SSR na Zerops
# Docs: https://docs.zerops.io/zerops-yaml/specification
zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles: ./
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        NEXT_PUBLIC_SITE_URL: https://usedlostvodice.cz
        ADMIN_USER: admin
        ADMIN_PASSWORD: VodiceAdmin2026!
      start: npm run start
      healthCheck:
        httpGet:
          port: 3000
          path: /
