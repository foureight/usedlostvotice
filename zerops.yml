# Usedlost Vodice — Next.js SSR na Zerops
# Docs: https://docs.zerops.io/zerops-yaml/specification
zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm ci
        - npm run build
      deployFiles: ./
    deploy:
      # New container gets traffic only once Next.js really answers.
      readinessCheck:
        httpGet:
          port: 3000
          path: /
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      # Volume dál drží nahrané fotky mezi deployi (dokud běží i local helpers).
      volume:
        hostname: cmsdata
        mountPath: /srv/cms
        readOnly: false
      envVariables:
        NODE_ENV: production
        PORT: "3000"
        NEXT_PUBLIC_SITE_URL: https://usedlostvodice.cz
        ADMIN_USER: michal@tribo.cz
        # ADMIN_PASSWORD / KEYSTATIC_ADMIN_PASSWORD / ADMIN_SECRET patří JEN
        # do Zerops GUI → app → Environment variables → Secret variables.
        # Nikdy je sem nepiš: hodnoty v zerops.yml přebíjí secrety a repo je veřejné.
        CMS_DATA_DIR: /srv/cms
        # GitHub Keystatic mode: nastav CLIENT_ID až po vytvoření GitHub App.
        # Nenechávej unresolved ${placeholders} — spustí falešný GitHub režim
        # a schová multi-upload / náhled fotek.
      start: sh scripts/zerops-start.sh
      healthCheck:
        httpGet:
          port: 3000
          path: /
